name: Lab3 CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DVC pipeline
        run: dvc repro

      - name: Run tests with coverage
        run: pytest --cov=src/wine_quality_mlops --cov-report=xml --cov-report=term-missing

      - name: Resolve image tag
        id: image_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=sha-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: docker build -t wine-quality-mlops-lab3:${{ steps.image_meta.outputs.tag }} -t wine-quality-mlops-lab3:latest .

      - name: Login to DockerHub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag wine-quality-mlops-lab3:${{ steps.image_meta.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-mlops-lab3:${{ steps.image_meta.outputs.tag }}
          docker tag wine-quality-mlops-lab3:latest ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-mlops-lab3:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-mlops-lab3:${{ steps.image_meta.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-mlops-lab3:latest

      - name: Generate dev_sec_ops metadata
        run: python scripts/generate_dev_sec_ops.py --image-ref wine-quality-mlops-lab3:${{ steps.image_meta.outputs.tag }} --coverage-xml coverage.xml --output dev_sec_ops.yml

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab3-ci-artifacts
          path: |
            coverage.xml
            dev_sec_ops.yml
            artifacts/metrics.json
